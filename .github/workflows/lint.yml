name: Lint and Format

on:
  push:
    branches:
      - initbranch
  pull_request:
    branches:
      - initbranch

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Run Prettier
        run: npx prettier --write "**/*.{js,jsx,ts,tsx,json,css,md}"

      - name: Run ESLint
        run: npx eslint . --ext .js,.jsx,.ts,.tsx
